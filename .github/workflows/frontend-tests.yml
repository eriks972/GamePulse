name: Frontend Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  jest:
    name: Jest tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        working-directory: frontend/gamepulse-web

    steps:
      - name: Check out frontend
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          sparse-checkout: frontend/gamepulse-web

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/gamepulse-web/package-lock.json

      - name: Install dependencies
        run: npm ci --include=dev

      - name: Run Jest
        run: npm test -- --ci --runInBand